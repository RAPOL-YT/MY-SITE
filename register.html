
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CREATE ACCOUNT </title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="login-page">


    <!-- =========================
         REGISTER CONTAINER
    ========================== -->

    <main class="login-container">


        <div class="login-box">


            <!-- LOGO -->

            <a href="index.html"
               class="logo login-logo">

                RAPOL<span>YT</span>

            </a>


            <!-- SMALL TITLE -->

            <p class="login-small-title">
               WHY SO SERIOUS
            </p>


            <!-- TITLE -->

            <h1>
                إنشاء حساب
            </h1>


            <!-- DESCRIPTION -->

            <p class="login-description">

                أنشئ حسابك وابدأ باستخدام
                الموقع.

            </p>



            <!-- =========================
                 REGISTER FORM
            ========================== -->

            <form id="registerForm">


                <!-- NAME -->

                <div class="input-group">

                    <label for="name">
                        الاسم
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="اكتب اسمك"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="6 أحرف على الأقل"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        تأكيد كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="أعد كتابة كلمة المرور"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>



                <!-- TERMS -->

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>

                        أوافق على شروط استخدام الموقع.

                    </span>

                </label>



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="btn btn-orange login-button"
                >

                    إنشاء الحساب

                </button>



                <!-- MESSAGE -->

                <p
                    id="registerMessage"
                    class="login-message"
                ></p>


            </form>



            <!-- =========================
                 LOGIN LINK
            ========================== -->

            <div class="register-section">

                <p>

                    لديك حساب بالفعل؟

                    <a href="login.html">

                        تسجيل الدخول

                    </a>

                </p>

            </div>



            <!-- BACK -->

            <a
                href="index.html"
                class="back-home"
            >

                ← العودة إلى الموقع

            </a>


        </div>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="js/auth.js">
    </script>


</body>

</html>
