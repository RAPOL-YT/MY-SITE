
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LOGIN</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="login-page">


    <!-- =========================
         LOGIN CONTAINER
    ========================== -->

    <main class="login-container">


        <!-- =========================
             LOGIN BOX
        ========================== -->

        <div class="login-box">


            <!-- LOGO -->

            <a href="index.html"
               class="logo login-logo">

                RAPOL<span>YT</span>

            </a>


            <!-- SMALL TITLE -->

            <p class="login-small-title">
                WELCOME BACK
            </p>


            <!-- TITLE -->

            <h1>
                تسجيل الدخول
            </h1>


            <!-- DESCRIPTION -->

            <p class="login-description">

                قم بتسجيل الدخول للوصول
                إلى حسابك.

            </p>



            <!-- =========================
                 LOGIN FORM
            ========================== -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- REMEMBER + FORGOT -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>
                            تذكرني
                        </span>

                    </label>


                    <a href="#"
                       id="forgotPassword">

                        نسيت كلمة المرور؟

                    </a>

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="btn btn-orange login-button"
                >

                    تسجيل الدخول

                </button>


                <!-- ERROR / SUCCESS MESSAGE -->

                <p
                    id="loginMessage"
                    class="login-message"
                ></p>


            </form>



            <!-- =========================
                 REGISTER
            ========================== -->

            <div class="register-section">

                <p>

                    ليس لديك حساب؟

                    <a href="register.html">

                        إنشاء حساب

                    </a>

                </p>

            </div>



            <!-- BACK -->

            <a
                href="index.html"
                class="back-home"
            >

                ← العودة إلى الموقع

            </a>


        </div>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script type="module"
            src="js/auth.js">
    </script>


</body>

</html>
